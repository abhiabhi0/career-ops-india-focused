# Portal Scanner Configuration — Generic Template
# Used by career-ops scan to discover new offers automatically.
# Role/skill/location values are loaded at runtime from config/profile.yml.
# The lists below serve as defaults that profile.yml extends.

# -- Title filter (defaults) --
# At runtime, profile.yml `job_criteria.allowed_titles` extends positive,
# and `job_criteria.blocked_phrases` extends negative.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Golang specific --
    - "Golang"
    - "Go Developer"
    - "Go Engineer"
    - "Go Lang"
    # -- Backend/software roles --
    - "Backend Engineer"
    - "Backend Developer"
    - "Software Engineer"
    - "Software Developer"
    - "API Engineer"
    - "Server Engineer"
  negative:
    # -- Roles to skip --
    - "Junior"
    - "Intern"
    - "Trainee"
    - "Fresher"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "SAP "
    - "Salesforce Admin"
    - "COBOL"
    - "Mainframe"
    - "Frontend"
    - "React Native"
    - "Flutter"
    - "Data Analyst"
    - "Business Analyst"
    - "QA "
    - "Manual Test"
    - "Full Stack"
    - "Fullstack"
    - "Platform Engineer"
    - "Infrastructure Engineer"
    - "Systems Engineer"
    - "Site Reliability"
    - "SRE"
    - "DevOps"
    - "Cloud Engineer"
    - "Lead "
    - "Staff "
    - "Principal"
    - "Manager"
    - "Director"
    - "Vice President"
    - "VP "
    - "Head of"
    - "Architect"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Mid"

# -- Search queries --
# WebSearch queries for discovering roles. Queries can use placeholders
# that are interpolated at runtime from config/profile.yml:
#   {roles}          → OR-list of target_roles.primary
#   {skills}         → OR-list of job_criteria.required_skills
#   {locations}      → OR-list of job_criteria.allowed_locations
#   {skills_or_roles} → union of roles + skills
# Queries without placeholders are used as-is (backward compatible).

search_queries:

  # -- Golang specific --
  - name: Ashby — Golang
    query: 'site:jobs.ashbyhq.com ("Golang" OR "Go Developer" OR "Go Engineer") ("remote" OR "remote from India" OR "Remote - India" OR "APAC" OR "global remote" OR "work from anywhere")'
    enabled: true

  - name: Greenhouse — Golang
    query: '(site:boards.greenhouse.io OR site:job-boards.greenhouse.io) ("Golang" OR "Go Developer" OR "Go Engineer") ("remote" OR "remote from India" OR "Remote - India" OR "APAC" OR "global remote" OR "work from anywhere")'
    enabled: true

  - name: Lever — Golang
    query: 'site:jobs.lever.co ("Golang" OR "Go Engineer" OR "Go Developer") ("remote" OR "remote from India" OR "Remote - India" OR "APAC" OR "global remote" OR "work from anywhere")'
